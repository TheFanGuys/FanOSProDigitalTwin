<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FanOS Pro — Cabinet + System Twin</title>
<style>
  :root{
    --bg:#0a1929;
    --panel:#0f2334;
    --panel2:#143047;
    --line:#1e3a52;
    --txt:#e8eef5;
    --dim:#8aa0b4;
    --blue:#2196f3;
    --blue2:#64b5f6;
    --navy:#0a1929;
    --green:#43d17a;
    --red:#ff4d4f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;}
  #scene{position:fixed;inset:0;touch-action:none;}
  canvas{display:block;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

  /* Header / brand */
  #hdr{position:fixed;top:0;left:0;right:0;padding:12px 14px;display:flex;align-items:center;
    gap:10px;z-index:5;pointer-events:none;}
  #sysBadge{margin-left:auto;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.6px;
    padding:4px 10px;border:1px solid #2b3a4a;border-radius:7px;color:#7fb2d8;background:rgba(8,18,28,.55);pointer-events:none;}
  #dash{border-left:3px solid rgba(33,150,243,.45);}
  .dbtn{font-variant-numeric:tabular-nums;} .pill{letter-spacing:.3px;}
  #iSpecs{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;}
  #iSpecs .k{color:var(--dim);} #iSpecs .v{color:var(--txt);text-align:right;font-variant-numeric:tabular-nums;}
  #iSpecs .v.ok{color:var(--green);} #iSpecs .v.bad{color:#ff6b6b;} #iSpecs .v.warn{color:#ffd27a;}
  #cam{position:fixed;left:0;right:0;bottom:150px;display:flex;gap:7px;overflow-x:auto;padding:0 14px;z-index:6;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  #cam::-webkit-scrollbar{display:none;}
  .cchip{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:7px 13px;white-space:nowrap;cursor:pointer;}
  .cchip:active{transform:scale(.96);} .cchip.active{border-color:var(--blue);color:var(--blue2);}
  #diag{position:fixed;left:10px;right:10px;bottom:64px;z-index:8;display:none;max-height:62vh;overflow:auto;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:12px;max-width:560px;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  #diag.show{display:block;}
  #diag h3{font-size:13px;margin:0 0 10px;color:var(--txt);letter-spacing:.4px;}
  .drow{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;}
  .drow .k{color:var(--dim);} .drow .v{font-variant-numeric:tabular-nums;color:var(--txt);}
  .drow .v.ok{color:var(--green);} .drow .v.bad{color:#ff6b6b;} .drow .v.warn{color:#ffd27a;}
  #comm{position:fixed;left:10px;right:10px;bottom:64px;z-index:9;display:none;max-height:72vh;overflow:auto;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:580px;margin:0 auto;box-shadow:0 12px 44px rgba(0,0,0,.55);}
  #comm.show{display:block;}
  #comm h3{font-size:14px;margin:2px 0 4px;color:#fff;letter-spacing:.3px;}
  #comm h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:16px 0 8px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:5px;}
  #comm .csub{font-size:11px;color:var(--dim);margin-bottom:8px;}
  .cbtn{appearance:none;border:1px solid var(--blue);background:linear-gradient(135deg,rgba(33,150,243,.22),rgba(33,150,243,.06));color:#cfe6fb;font-size:13px;font-weight:700;padding:12px 14px;border-radius:11px;cursor:pointer;width:100%;margin:4px 0;letter-spacing:.3px;}
  .cbtn:active{transform:scale(.98);} .cbtn[disabled]{opacity:.45;border-color:var(--line);background:var(--panel2);color:var(--dim);}
  .cbtn.sec{border-color:var(--line);background:var(--panel2);color:var(--txt);}
  .cprog{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:8px 0;border:1px solid var(--line);}
  .cprog>i{display:block;height:100%;background:linear-gradient(90deg,#2196f3,#26c6da);width:0;transition:width .25s;}
  .dev{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 12px;margin:8px 0;}
  .dev .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .dev .dn{font-size:13px;font-weight:700;color:var(--txt);}
  .dev .dbus{font-size:10px;font-weight:700;color:#7fb2d8;border:1px solid #2b3a4a;border-radius:5px;padding:2px 6px;margin-left:6px;}
  .dev .dmeta{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 8px;font-size:11px;margin-top:8px;}
  .dev .dmeta .k{color:var(--dim);} .dev .dmeta .v{color:var(--txt);text-align:right;font-variant-numeric:tabular-nums;}
  .dst{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.4px;}
  .dst.found{color:#7fd0ff;background:rgba(33,150,243,.14);} .dst.addr{color:var(--green);background:rgba(67,209,122,.14);} .dst.none{color:var(--dim);background:var(--panel);}
  .dactions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .dactions .mini{flex:1;min-width:96px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:12px;font-weight:600;padding:9px;border-radius:9px;cursor:pointer;}
  .dactions .mini:active{transform:scale(.97);} .dactions .mini.id{border-color:#1d4a6b;color:#7fd0ff;}
  .addr-set{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .addr-set .step{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:18px;font-weight:700;cursor:pointer;}
  .addr-set .num{min-width:42px;text-align:center;font-family:ui-monospace,monospace;font-size:15px;font-weight:700;color:#fff;}
  .addr-set .apply{flex:1;border:1px solid var(--blue);background:rgba(33,150,243,.14);color:#cfe6fb;font-size:12px;font-weight:700;padding:9px;border-radius:9px;cursor:pointer;}
  .cwarn{background:rgba(255,59,48,.14);border:1px solid #5a1e22;color:#ff9a9a;font-size:12px;font-weight:600;padding:9px 11px;border-radius:9px;margin:8px 0;display:none;}
  .cwarn.show{display:block;}
  .bushealth{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .bcard{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:11px;}
  .bcard .bt{font-size:12px;font-weight:700;color:#fff;margin-bottom:8px;}
  .bcard .br{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;}
  .bcard .br .k{color:var(--dim);} .bcard .br .v{font-variant-numeric:tabular-nums;}
  .tag2{font-weight:800;font-size:10px;letter-spacing:.4px;}
  .tag2.good{color:var(--green);} .tag2.warn{color:#ffd27a;} .tag2.fault{color:#ff6b6b;}
  .vrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.04);}
  .vrow .k{color:var(--txt);} .vstat{font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px;letter-spacing:.5px;}
  .vstat.pass{color:var(--green);background:rgba(67,209,122,.14);} .vstat.wait{color:var(--dim);background:var(--panel);} .vstat.warn{color:#ffd27a;background:rgba(230,172,0,.14);}
  #commReport{border:1px solid var(--line);background:#0b1622;border-radius:11px;padding:12px;margin-top:8px;font-size:12px;line-height:1.7;display:none;}
  #commReport.show{display:block;} #commReport b{color:#cfe6fb;} #commReport .rh{font-size:13px;font-weight:700;color:#fff;margin-bottom:6px;}
  #facility{position:fixed;left:10px;right:10px;bottom:64px;z-index:9;display:none;max-height:74vh;overflow:auto;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:600px;margin:0 auto;box-shadow:0 12px 44px rgba(0,0,0,.55);}
  #facility.show{display:block;}
  #facility h3{font-size:14px;margin:2px 0 4px;color:#fff;letter-spacing:.3px;}
  #facility h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:15px 0 8px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:5px;}
  #facility .csub{font-size:11px;color:var(--dim);margin-bottom:10px;}
  #floorWrap{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0a1320;}
  #floorCanvas{display:block;width:100%;height:auto;touch-action:manipulation;}
  .fstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .fstat .sc{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 11px;}
  .fstat .sc .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);}
  .fstat .sc .v{font-size:15px;font-weight:700;color:#fff;margin-top:2px;font-variant-numeric:tabular-nums;}
  .fstat .sc .v.ok{color:var(--green);} .fstat .sc .v.bad{color:#ff6b6b;} .fstat .sc .v.warn{color:#ffd27a;}
  .fpre{display:flex;gap:7px;flex-wrap:wrap;}
  .fpre .pc{flex:1 0 auto;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:12px;font-weight:600;padding:9px 10px;border-radius:9px;cursor:pointer;}
  .fpre .pc:active{transform:scale(.97);} .fpre .pc.on{border-color:var(--blue);color:#cfe6fb;background:rgba(33,150,243,.14);}
  .zcard{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;margin:10px 0;}
  .zcard .zh{display:flex;align-items:center;justify-content:space-between;}
  .zcard .zn{font-size:14px;font-weight:700;color:#fff;} .zcard .zn .zt{font-size:11px;color:var(--dim);font-weight:500;margin-left:6px;}
  .zcard .zstat{font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px;letter-spacing:.4px;}
  .zstat.run{color:var(--green);background:rgba(67,209,122,.14);} .zstat.idle{color:var(--dim);background:var(--panel);} .zstat.flt{color:#ff6b6b;background:rgba(255,59,48,.14);} .zstat.stop{color:#ffd27a;background:rgba(230,172,0,.14);}
  .zcard .zmeta{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;font-size:11px;margin:9px 0;}
  .zcard .zmeta .k{color:var(--dim);} .zcard .zmeta .v{color:var(--txt);text-align:right;font-variant-numeric:tabular-nums;}
  .zctl{display:flex;gap:7px;flex-wrap:wrap;}
  .zctl button{flex:1;min-width:70px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:12px;font-weight:600;padding:10px 8px;border-radius:9px;cursor:pointer;}
  .zctl button:active{transform:scale(.97);}
  .zctl button.start{border-color:#1f6b3a;color:#7be0a4;} .zctl button.stop{border-color:#6b1f22;color:#ff9a9a;} .zctl button.idf{border-color:#1d4a6b;color:#7fd0ff;}
  .panelHdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .panelClose{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:18px;line-height:1;font-weight:700;cursor:pointer;}
  .panelClose:active{transform:scale(.94);}
  #demo{position:fixed;left:10px;right:10px;bottom:64px;z-index:14;display:none;max-width:560px;margin:0 auto;
    background:linear-gradient(160deg,rgba(12,28,46,.97),rgba(8,18,32,.97));backdrop-filter:blur(14px);
    border:1px solid rgba(33,150,243,.35);border-radius:16px;padding:16px;box-shadow:0 14px 50px rgba(0,0,0,.6);}
  #demo.show{display:block;}
  #demo .dmtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  #demo .dmstep{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#5fa8e0;}
  #demo .dmcount{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
  #demo h3{font-size:18px;font-weight:800;color:#fff;margin:2px 0 6px;letter-spacing:.2px;}
  #demo .dmbody{font-size:14px;line-height:1.55;color:#d4e2ef;margin-bottom:12px;}
  #demo .dmval{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 4px;}
  #demo .dmval .vc{border:1px solid rgba(33,150,243,.25);background:rgba(33,150,243,.08);border-radius:10px;padding:9px;text-align:center;}
  #demo .dmval .vc .ic{font-size:17px;} #demo .dmval .vc .tx{font-size:11px;font-weight:700;color:#cfe6fb;margin-top:3px;line-height:1.25;}
  #demo .dmnav{display:flex;gap:8px;margin-top:6px;}
  #demo .dmnav button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;font-weight:700;padding:13px;border-radius:11px;cursor:pointer;}
  #demo .dmnav button:active{transform:scale(.97);} #demo .dmnav button.prim{border-color:var(--blue);background:rgba(33,150,243,.18);color:#cfe6fb;}
  #demo .dmnav button[disabled]{opacity:.4;}
  #demo .dmsub{display:flex;gap:8px;margin-top:8px;}
  #demo .dmsub button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:12px;font-weight:600;padding:11px 8px;border-radius:10px;cursor:pointer;}
  #demo .dmsub button.on{border-color:var(--blue);color:#cfe6fb;background:rgba(33,150,243,.14);}
  #demo .dmsub button.exit{border-color:#6b1f22;color:#ff9a9a;}
  body.clean #controls, body.clean #cam, body.clean #hint, body.clean #info, body.clean #dash, body.clean #diag, body.clean #comm, body.clean #facility, body.clean #spec, body.clean #chips{display:none !important;}
  body.clean #demo{bottom:16px;}
  #service{position:fixed;left:10px;right:10px;bottom:64px;z-index:11;display:none;max-height:74vh;overflow:auto;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:600px;margin:0 auto;box-shadow:0 12px 44px rgba(0,0,0,.55);}
  #service.show{display:block;}
  #service h3{font-size:14px;margin:2px 0 4px;color:#fff;}
  #svtabs{display:flex;gap:6px;margin:10px 0 12px;overflow-x:auto;scrollbar-width:none;}
  #svtabs::-webkit-scrollbar{display:none;}
  #svtabs .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-size:12px;font-weight:700;padding:9px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;}
  #svtabs .tab.on{border-color:var(--blue);color:#cfe6fb;background:rgba(33,150,243,.14);}
  .svrow{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;}
  .svrow:active{transform:scale(.995);}
  .svrow .rt{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .svrow .rd{font-size:13px;font-weight:700;color:#fff;} .svrow .rts{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .svrow .rm{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--txt);}
  .svrow .rm .chip{border:1px solid var(--line);border-radius:6px;padding:2px 7px;}
  .sev{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.3px;}
  .sev.Critical{color:#ff6b6b;background:rgba(255,59,48,.14);} .sev.Warning{color:#ffd27a;background:rgba(230,172,0,.14);}
  .sev.Minor{color:#9bd0ff;background:rgba(33,150,243,.12);} .sev.Info{color:#9fe6c0;background:rgba(67,209,122,.12);}
  .svsteps{margin-top:10px;border-top:1px solid rgba(255,255,255,.06);padding-top:9px;}
  .svsteps .st{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin-bottom:6px;}
  .svsteps ol{margin:0;padding-left:18px;} .svsteps li{font-size:12.5px;line-height:1.6;color:#d4e2ef;}
  .svact{font-size:11px;color:#9fd3ff;margin-top:7px;}
  .mcard{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:11px 12px;margin:8px 0;}
  .mcard .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .mcard .mn{font-size:13px;font-weight:700;color:#fff;}
  .mcard .mst{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.3px;}
  .mst.ok{color:var(--green);background:rgba(67,209,122,.14);} .mst.soon{color:#ffd27a;background:rgba(230,172,0,.14);} .mst.due{color:#ff6b6b;background:rgba(255,59,48,.14);}
  .mcard .mm{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 8px;font-size:11px;margin-top:7px;}
  .mcard .mm .k{color:var(--dim);} .mcard .mm .v{color:var(--txt);text-align:right;}
  .mcard .mnote{margin-top:7px;font-size:11px;color:var(--dim);font-style:italic;}
  .trend{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 12px;margin:8px 0;}
  .trend .th{display:flex;align-items:baseline;justify-content:space-between;} .trend .tn{font-size:12px;font-weight:700;color:#fff;} .trend .tv{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
  .trend canvas{display:block;width:100%;height:54px;margin-top:6px;}
  .svnote-add{display:flex;gap:8px;margin-bottom:10px;}
  .svnote-add input{flex:1;border:1px solid var(--line);background:var(--panel2);color:#fff;font-size:13px;padding:11px;border-radius:10px;}
  .svnote-add button{flex:0 0 auto;border:1px solid var(--blue);background:rgba(33,150,243,.16);color:#cfe6fb;font-size:13px;font-weight:700;padding:11px 16px;border-radius:10px;cursor:pointer;}
  .svlog{border:1px solid var(--line);background:#0b1622;border-radius:10px;padding:10px;}
  .svlog .ln{font-size:12px;line-height:1.5;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);color:#d4e2ef;}
  .svlog .ln:last-child{border-bottom:none;} .svlog .ln .lt{color:var(--dim);font-size:10px;font-variant-numeric:tabular-nums;margin-right:8px;}
  .svtoggle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;color:var(--txt);}
  .svtoggle button{border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-size:12px;font-weight:700;padding:8px 12px;border-radius:9px;cursor:pointer;}
  .svtoggle button.on{border-color:var(--blue);color:#cfe6fb;background:rgba(33,150,243,.14);}
  .svempty{font-size:12px;color:var(--dim);padding:10px 2px;}
  #hdr svg{width:40px;height:40px;flex:0 0 auto;}
  #hdr .wm{line-height:1;}
  #hdr .wm .nm{font-size:17px;font-weight:800;letter-spacing:.2px;}
  #hdr .wm .nm b{color:#fff;}
  #hdr .wm .badge{background:var(--blue);color:#fff;font-size:12px;font-weight:800;
    padding:2px 7px;border-radius:6px;margin-left:3px;}
  #hdr .wm .tag{font-size:10px;color:var(--blue2);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}

  #spec{position:fixed;top:13px;right:13px;z-index:5;text-align:right;pointer-events:none;}
  #spec .cap{font-size:13px;font-weight:800;color:#fff;letter-spacing:.3px;}
  #spec .meta{font-size:10px;color:var(--dim);letter-spacing:.4px;margin-top:2px;
    font-family:ui-monospace,Menlo,monospace;}

  /* Chips */
  #chips{position:fixed;left:10px;right:10px;top:70px;z-index:5;display:flex;gap:7px;
    overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  #chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:rgba(15,35,52,.82);
    backdrop-filter:blur(6px);color:var(--dim);font-size:12px;font-weight:600;
    padding:7px 11px;border-radius:20px;white-space:nowrap;cursor:pointer;}
  .chip.active{color:#fff;border-color:var(--blue);background:rgba(33,150,243,.18);}

  /* Info sheet */
  #info{position:fixed;left:10px;right:10px;bottom:64px;z-index:7;background:rgba(15,35,52,.97);
    backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:14px 15px;
    transform:translateY(150%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:520px;margin:0 auto;}
  #info.show{transform:translateY(0);}
  #info .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  /* Wiring layers panel */
  #layers{position:fixed;left:10px;right:10px;bottom:64px;z-index:8;display:none;
    background:rgba(15,35,52,.97);backdrop-filter:blur(12px);border:1px solid var(--line);

  #layers .ltitle{font-size:13px;font-weight:800;}

    padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:700;}
  #layers .lchips{display:flex;flex-wrap:wrap;gap:7px;}
  .lchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);
    color:var(--dim);font-size:12px;font-weight:600;padding:8px 11px;border-radius:20px;cursor:pointer;}
  .lchip .sw{width:16px;height:16px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:transparent;}

  .legttl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--blue2);

  .legbox{display:flex;flex-direction:column;gap:0;}

    padding:7px 0;border-top:1px solid var(--line);font-size:11.5px;}
  .specrow .sw{width:14px;height:14px;border-radius:4px;background:currentColor;border:1px solid rgba(255,255,255,.2);}
  .specnm{font-weight:700;color:var(--txt);}
  .spectp{color:var(--dim);}
  .specaw{color:var(--blue2);font-family:ui-monospace,Menlo,monospace;text-align:right;font-weight:700;}

function tube(p1,p2,material,rad){
  var dir=new THREE.Vector3().subVectors(p2,p1), len=dir.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,len,8),material); m.castShadow=true;
  m.position.copy(p1).add(p2).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  return m;
}

function makeHVLS(d){
  var g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,1.6,20),M.hvlsHub));                 // motor housing
  g.add(place(new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.05,0.5,20),M.hvlsHub),0,1.0,0));  // top shroud
  g.add(place(new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.7,12),M.motor),0,1.55,0));   // downrod stub
  g.add(place(new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.4,20),M.hvlsHub),0,-0.9,0));   // hub plate
  for(var hb=0;hb<6;hb++){ var a=hb*Math.PI/3;
    g.add(place(new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.45,6),M.rail),Math.cos(a)*1.15,-0.9,Math.sin(a)*1.15)); } // hub bolts
  var blades=new THREE.Group();
  for(var b=0;b<6;b++){ var arm=new THREE.Group(); arm.rotation.y=b*(Math.PI/3);
    arm.add(place(new THREE.Mesh(new THREE.BoxGeometry(1.1,0.28,0.55),M.rail),1.05,-0.9,0));     // blade bracket
    var blade=new THREE.Mesh(new THREE.BoxGeometry(d,0.13,1.15),M.hvlsBlade);                    // airfoil blade
    blade.position.set(d/2+1.5,-0.92,0); blade.rotation.x=0.14; blade.castShadow=true; arm.add(blade); // slight pitch
    var cap=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.34,1.15),M.hvlsHub);                     // winglet end cap
    cap.position.set(d+1.5,-0.92,0); cap.rotation.x=0.14; arm.add(cap);
    blades.add(arm); }
  g.add(blades);
  g.traverse(function(c){ if(c.isMesh){ c.userData.key='fan'; selectable.push(c); (partRefs.fan=partRefs.fan||[]).push(c);} });
  return {group:g, blades:blades};
}

// ---- field devices: each fan as a real installation (rack, drive, disconnect, conduit) ----
var ceilY=20, floorY=-9.5;
farmFans.forEach(function(f,i){
  var rackZ=f.vfd.z-0.95, xD=f.vfd.x-2.4;                    // disconnect x
  // Unistrut drive rack to the floor (nothing floats)
  [xD-0.7, f.vfd.x+0.9].forEach(function(px){
    field.add(place(box(0.3,(f.vfd.y+2.6)-floorY,0.3,M.strut), px, (f.vfd.y+2.6+floorY)/2, rackZ)); });
  [f.vfd.y+1.8,f.vfd.y-1.9].forEach(function(py){
    field.add(place(box((f.vfd.x+0.9)-(xD-0.7),0.25,0.3,M.strut), ((xD-0.7)+(f.vfd.x+0.9))/2, py, rackZ)); });
  // building-feed J-box on top of the rack
  field.add(place(box(1.2,0.8,0.8,M.disc), xD, f.vfd.y+2.5, rackZ+0.3));

  // VFD (keep children[0] for tap + fault glow)
  var vd=makeVFD(); var vg=vd.group; vg.position.copy(f.vfd); field.add(vg);
  var body=vg.children[0]; body.userData.idx=i; driveMeshes.push(body); body.material=M.vfdBody.clone();
  vfdLeds.push(vd.leds);

  // HVLS fan head
  var hv=makeHVLS(5.6); hv.group.position.copy(f.fan); field.add(hv.group);
  farmBlades.push(hv.blades);

  // disconnect beside the VFD, on the rack

var demoActive=false, demoIdx=0, demoStep=null, demoHi=[], demoAuto=false, demoAutoAcc=0, demoPulseAcc=0, demoFireGlow=false, demoSnap=null, demoBuilt=false;

 {t:'VFD Fan Control', c:'Each HVLS fan runs from its own variable-frequency drive, so speed is controlled smoothly and monitored continuously.',

   cam:{t:[-1,-2,-10],r:72,th:0.75,ph:1.2}, keys:['disconnect','vfd'], callout:{key:'disconnect',text:'Lockable disconnect'}},

// --- 3D callout (glowing ring + leader line + label, billboarded, follows component) ---
var demoCalloutGroup=new THREE.Group(); scene.add(demoCalloutGroup); demoCalloutGroup.visible=false;
var calloutTargetMesh=null, calloutFixedPos=null;
function rrect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function clearCallout(){ while(demoCalloutGroup.children.length) demoCalloutGroup.remove(demoCalloutGroup.children[0]); demoCalloutGroup.visible=false; calloutTargetMesh=null; calloutFixedPos=null; }
function buildCallout(text){
  demoCalloutGroup.add(new THREE.Mesh(new THREE.TorusGeometry(1.5,0.07,12,40), new THREE.MeshBasicMaterial({color:0x35a7ff,transparent:true,opacity:0.9,toneMapped:false,depthTest:false})));
  var line=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,3,8), new THREE.MeshBasicMaterial({color:0x35a7ff,transparent:true,opacity:0.7,toneMapped:false,depthTest:false})); line.position.y=2.6; demoCalloutGroup.add(line);
  var c=document.createElement('canvas'); c.width=512;c.height=128; var g=c.getContext('2d');
  g.clearRect(0,0,512,128); g.fillStyle='rgba(10,25,41,.92)'; rrect(g,6,30,500,68,16); g.fill(); g.strokeStyle='#2196f3'; g.lineWidth=3; rrect(g,6,30,500,68,16); g.stroke();
  g.fillStyle='#eaf4ff'; g.font='600 40px system-ui,Arial'; g.textBaseline='middle'; g.fillText(text,28,66);
  var lab=new THREE.Mesh(new THREE.PlaneGeometry(8,2), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,toneMapped:false,depthTest:false}));
  lab.position.y=4.5; lab.renderOrder=999; demoCalloutGroup.add(lab); demoCalloutGroup.visible=true;
}

function emitDemoPulse(which){ if(which==='A'||which==='both') tracePulse(busPath.A,0x35a7ff); if(which==='B'||which==='both') tracePulse(busPath.B,0x35a7ff); }
function demoClear(){ demoHi.forEach(function(k){ setEm(k,false); }); demoHi=[]; clearCallout(); demoFireGlow=false; }
function applyStep(i){ demoIdx=Math.max(0,Math.min(DEMO.length-1,i)); var s=DEMO[demoIdx]; demoStep=s; demoClear(); gotoPreset(s.cam);
  if(s.keys&&s.keys.length){ dimScene(true); s.keys.forEach(function(k){ setEm(k,true); demoHi.push(k); }); } else dimScene(false);
  if(s.layer&&SYS[s.layer]) SYS[s.layer].visible=true;
  demoFireGlow=!!s.fire;
  if(s.fans){ farmFans.forEach(function(f){ f.on=true; }); }
  if(s.pulse) emitDemoPulse(s.pulse);
  if(s.callout){ buildCallout(s.callout.text);
    if(s.callout.key&&partRefs[s.callout.key]&&partRefs[s.callout.key][0]) calloutTargetMesh=partRefs[s.callout.key][0];
    else if(s.callout.pos) calloutFixedPos=new THREE.Vector3(s.callout.pos[0],s.callout.pos[1],s.callout.pos[2]); }
  demoAutoAcc=0; renderDemoCard(); }
function updateAutoBtn(){ var ab=document.getElementById('dmAuto'); if(ab){ ab.classList.toggle('on',demoAuto); ab.textContent=demoAuto?'Auto: On':'Auto Play'; } }
function renderDemoCard(){ var s=DEMO[demoIdx];
  document.getElementById('dmTitle').textContent=s.t; document.getElementById('dmBody').textContent=s.c;
  document.getElementById('dmCount').textContent=(demoIdx+1)+' / '+DEMO.length;
  var vEl=document.getElementById('dmVal'); if(s.val){ vEl.style.display='grid'; vEl.innerHTML=VALUE.map(function(v){return '<div class="vc"><div class="ic">'+v.ic+'</div><div class="tx">'+v.tx+'</div></div>';}).join(''); } else vEl.style.display='none';
  var bk=demoEl.querySelector('[data-act=back]'), nx=demoEl.querySelector('[data-act=next]'); if(bk)bk.disabled=demoIdx===0; if(nx)nx.disabled=demoIdx===DEMO.length-1; }
function buildDemoCard(){ if(demoBuilt)return; demoBuilt=true;
  demoEl.innerHTML='<div class="dmtop"><div class="dmstep">Guided product demo</div><div class="dmcount" id="dmCount">1 / 12</div></div>'+
    '<h3 id="dmTitle"></h3><div class="dmbody" id="dmBody"></div><div class="dmval" id="dmVal" style="display:none"></div>'+
    '<div class="dmnav"><button data-act="back">◀ Back</button><button class="prim" data-act="next">Next ▶</button></div>'+
    '<div class="dmsub"><button data-act="start">▶ Start</button><button data-act="pause">⏸ Pause</button></div>'+
    '<div class="dmsub"><button data-act="auto" id="dmAuto">Auto Play</button><button data-act="clean" id="dmClean">Clean View</button><button class="exit" data-act="exit">Exit</button></div>'; }
function demoEnter(){ if(demoActive)return; demoActive=true; closeAllPanels('__none__');
  demoSnap={ fans:farmFans.map(function(f){return {on:f.on,cmd:f.cmd};}), lay:{}, cam:{t:target.clone(),s:{radius:sph.radius,theta:sph.theta,phi:sph.phi}} };
  Object.keys(SYS).forEach(function(k){ demoSnap.lay[k]=SYS[k].visible; });
  buildDemoCard(); demoEl.classList.add('show'); demoBtn.classList.add('on'); demoAuto=false; updateAutoBtn(); applyStep(0); }
function demoExit(){ if(!demoActive)return; demoActive=false; demoAuto=false; demoClear(); dimScene(false); document.body.classList.remove('clean');
  if(demoSnap){ farmFans.forEach(function(f,i){ f.on=demoSnap.fans[i].on; f.cmd=demoSnap.fans[i].cmd; });
    Object.keys(SYS).forEach(function(k){ SYS[k].visible=demoSnap.lay[k]; });
    gotoPreset({t:[demoSnap.cam.t.x,demoSnap.cam.t.y,demoSnap.cam.t.z],r:demoSnap.cam.s.radius,th:demoSnap.cam.s.theta,ph:demoSnap.cam.s.phi}); }
  demoEl.classList.remove('show'); demoBtn.classList.remove('on'); var cb=document.getElementById('dmClean'); if(cb)cb.classList.remove('on'); }
demoEl.addEventListener('click',function(e){ var t=e.target.closest?e.target.closest('[data-act]'):null; if(!t)return; var a=t.dataset.act;
  if(a==='next') applyStep(demoIdx+1); else if(a==='back') applyStep(demoIdx-1);
  else if(a==='start'){ demoAuto=true; demoAutoAcc=0; updateAutoBtn(); applyStep(0); }
  else if(a==='pause'){ demoAuto=false; updateAutoBtn(); }
  else if(a==='auto'){ demoAuto=!demoAuto; demoAutoAcc=0; updateAutoBtn(); }
  else if(a==='clean'){ document.body.classList.toggle('clean'); t.classList.toggle('on',document.body.classList.contains('clean')); }
  else if(a==='exit') demoExit(); });
demoBtn.onclick=function(){ if(demoActive) demoExit(); else demoEnter(); };

/* ---------------- Hint ---------------- */
var hintEl=document.getElementById('hint'),hintGone=false;
function hideHint(){ if(!hintGone){ hintGone=true; hintEl.style.opacity=0;
  setTimeout(function(){ hintEl.style.display='none'; },600); } }
setTimeout(hideHint,6500);

/* ---------------- Animate ---------------- */
var animTarget=new THREE.Vector3(0,1,-6), lastT=performance.now();
function loop(){
  requestAnimationFrame(loop);
  var now=performance.now(), dt=now-lastT; lastT=now;
  doorCurrent+=(doorTarget-doorCurrent)*0.12; doorPivot.rotation.y=doorCurrent;
  for(var c=0;c<coolingBlades.length;c++){ coolingBlades[c].rotation.y+=0.35; }
  for(var xb=0;xb<exhaustBlades.length;xb++){ exhaustBlades[xb].rotation.y+=fireAlarm?0:0.4; }
  for(var i=0;i<farmFans.length;i++){ var f=farmFans[i];
    var tgt=(f.on&&!f.fault&&!fireAlarm)?f.cmd/100*MAXRPM:0;
    f.rpm+=(tgt-f.rpm)*0.04; farmBlades[i].rotation.y+=f.rpm*0.00045*dt;
    var glow=(i===pollIdx&&(f.on||f.fault)&&!fireAlarm);
    driveMeshes[i].material.emissive=new THREE.Color(f.fault?0xff4d4f:(glow?0x43d17a:0x000000));
    driveMeshes[i].material.emissiveIntensity=f.fault?0.55:(glow?0.6:0);
    var L=vfdLeds[i]; if(L){
      var running=f.on&&!fireAlarm&&!f.fault;
      L.run.material.emissive.setHex(running?0x2ecc71:0x000000);
      L.run.material.emissiveIntensity=running?(0.55+0.45*Math.abs(Math.sin(now*0.006))):0.0;
      L.flt.material.emissive.setHex(f.fault?0xff3b30:0x000000);
      L.flt.material.emissiveIntensity=f.fault?(0.4+0.6*Math.abs(Math.sin(now*0.02))):0.0;
    }
    var VF=vfdFlash[i]; if(VF){ if(now<VF.until){ driveMeshes[i].material.emissive.setHex(VF.color);
        driveMeshes[i].material.emissiveIntensity=0.4+0.6*Math.abs(Math.sin(now*0.018)); } else { delete vfdFlash[i]; } }
  }
  pollAcc+=dt; if(pollAcc>250){ pollAcc=0; pollIdx=(pollIdx+1)%farmFans.length; }
  for(var q=0;q<cabLeds.length;q++){ var Ld=cabLeds[q], t=now*0.001+Ld.ph, v;
    switch(Ld.mode){
      case 'pwr':   v=0.75; break;
      case 'blink': v=0.25+0.55*Math.abs(Math.sin(t*2.0)); break;
      case 'act':   v=0.12+0.7*Math.abs(Math.sin(t*7.0+Math.sin(t*3.1))); break;
      case 'tx':    v=(pollAcc<70)?0.95:0.1; break;
      case 'rx':    v=(pollAcc>=70&&pollAcc<150)?0.95:0.1; break;
      default:      v=0.18+0.5*Math.abs(Math.sin(t*1.3));
    }
    Ld.mat.emissiveIntensity=v;
  }
  fireGlow.material.opacity=(fireAlarm||demoFireGlow)?(0.20+0.16*Math.abs(Math.sin(now*0.004))):0;
  for(var gf=genFlash.length-1;gf>=0;gf--){ var GF=genFlash[gf];
    if(now<GF.until){ var gk=0.4+0.6*Math.abs(Math.sin(now*0.018)); GF.meshes.forEach(function(m){ if(!m||!m.material)return;
        if(!m.userData._fclone){ m.material=m.material.clone(); m.userData._fclone=true; }
        if(m.material.emissive){ m.material.emissive.setHex(GF.color); m.material.emissiveIntensity=gk; } }); }
    else { GF.meshes.forEach(function(m){ if(m&&m.material&&m.material.emissive){ m.material.emissive.setHex(0x000000); m.material.emissiveIntensity=0; } }); genFlash.splice(gf,1); } }
  for(var tpi=tracePulses.length-1;tpi>=0;tpi--){ var TP=tracePulses[tpi]; TP.t+=dt*0.0009;
    if(TP.t>=1){ SYS.comms.remove(TP.mesh); tracePulses.splice(tpi,1); }
    else { TP.mesh.position.copy(pointAt({points:TP.pts,segs:TP.segs,total:TP.total},TP.t)); } }
  for(var bk in badges){ badges[bk].quaternion.copy(camera.quaternion); }
  for(var so=0;so<svOverlayGroup.children.length;so++){ svOverlayGroup.children[so].quaternion.copy(camera.quaternion); }
  if(serviceOverlays){ svOverlayAcc+=dt; if(svOverlayAcc>2200){ svOverlayAcc=0; tracePulse(busPath.A,0x35a7ff); tracePulse(busPath.B,0x35a7ff); } }
  for(var ai=0;ai<farmFans.length;ai++){ var af=farmFans[ai], inten=(af.on&&!af.fault&&!fireAlarm)?Math.min(1,af.rpm/MAXRPM):0;
    for(var rk=0;rk<3;rk++){ var rg=fanRings[ai][rk], ph=((now*0.0004)+(rk/3))%1, sc=1+ph*3.2;
      rg.scale.set(sc,sc,sc); rg.material.opacity=inten*0.16*(1-ph); } }
  if(facilityOpen){ facAcc+=dt; if(facAcc>250){ facAcc=0; drawFloor(); renderFacilityStats(); } }
  if(demoCalloutGroup.visible){ if(calloutTargetMesh){ var cwp=new THREE.Vector3(); calloutTargetMesh.getWorldPosition(cwp); demoCalloutGroup.position.copy(cwp); }
    else if(calloutFixedPos){ demoCalloutGroup.position.copy(calloutFixedPos); } demoCalloutGroup.quaternion.copy(camera.quaternion); }
  if(demoActive&&demoAuto){ demoAutoAcc+=dt; if(demoAutoAcc>10000){ demoAutoAcc=0; if(demoIdx<DEMO.length-1) applyStep(demoIdx+1); else { demoAuto=false; updateAutoBtn(); } } }
  if(demoActive&&demoStep&&demoStep.pulse){ demoPulseAcc+=dt; if(demoPulseAcc>1400){ demoPulseAcc=0; emitDemoPulse(demoStep.pulse); } }
  for(var pz=0;pz<pulses.length;pz++){ var P=pulses[pz];
    for(var pc=0;pc<P.count;pc++){ var fr=((now*0.001*P.speed)+P.off+pc/P.count)%1; P.meshes[pc].position.copy(pointAt(P,fr)); } }
  hmiAcc+=dt; if(hmiAcc>340){ hmiAcc=0; drawMasterHMI(masterHMI); drawDoorHMI(doorHMI);
    var sb=document.getElementById('sysBadge'); if(sb){ var s2=fitState(); sb.textContent=s2[0]; sb.style.color=s2[1]; sb.style.borderColor=s2[1]; } }
  refreshAcc+=dt; if(refreshAcc>120){ refreshAcc=0; refreshDash(); }
  explodeAmt+=(explodeTarget-explodeAmt)*0.1;
  if(explodeAmt>0.001||explodeTarget>0){ for(var ei=0;ei<explodeItems.length;ei++){ var it=explodeItems[ei]; it.o.position.z=it.z0+(it.z0-SPz)*explodeAmt*1.4; } }
  diagAcc+=dt; if(diagAcc>1000){ diagAcc=0; if(diagOpen) renderDiag(); if(infoEl.classList.contains('show')&&selectedKey) renderSpecs(selectedKey); }
  if(camTween.active){ camTween.t=Math.min(1,camTween.t+0.05); var ee=camTween.t*camTween.t*(3-2*camTween.t);
    target.lerpVectors(camTween.fromT,camTween.toT,ee);
    sph.radius=camTween.fromS.radius+(camTween.toS.radius-camTween.fromS.radius)*ee;
    sph.theta=camTween.fromS.theta+(camTween.toS.theta-camTween.fromS.theta)*ee;
    sph.phi=camTween.fromS.phi+(camTween.toS.phi-camTween.fromS.phi)*ee;
    if(camTween.t>=1) camTween.active=false; applyCam();
  } else { target.lerp(animTarget,0.08); applyCam(); }
  renderer.render(scene,camera);
}
loop();

window.addEventListener('resize',function(){ W=window.innerWidth; H=window.innerHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H); });
setTimeout(function(){ var l=document.getElementById('loader'); l.style.transition='opacity .4s';
  l.style.opacity=0; setTimeout(function(){ l.style.display='none'; },400); },400);

})();
</script>
